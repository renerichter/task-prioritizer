[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-prioritizer"
version = "0.3.1"
description = "A calm CLI/TUI for choosing what to work on and knowing when to stop."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Rene Lachmann" }]
keywords = ["productivity", "cli", "tui", "prioritization", "mindful"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "textual>=0.80",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.6",
]
llm = [
  "httpx>=0.27",
]
all = [
  "task-prioritizer[dev,llm]",
]

[project.scripts]
task-prioritizer = "task_prioritizer.main:main"
tp = "task_prioritizer.main:main"
tp-tui = "task_prioritizer.tui.app:run"

[project.urls]
Homepage = "https://github.com/renelachmann/task-prioritizer"

[tool.setuptools.packages.find]
where = ["."]
include = ["task_prioritizer*"]
exclude = ["tests*", "logs*", "scripts*", "docs*"]

# ---------------------------------------------------------------------------
# Ruff — lint + format. Pragmatic config; not exhaustive.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "logs", "docs/agent-memory"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",           # ruff-specific
]
ignore = [
  "E501",          # line length handled by formatter
  "B008",          # function call in default argument — common in CLI code
  "SIM108",        # ternary over if/else — readability call
  "RUF001",        # ambiguous unicode in strings (× is intentional mathematics)
  "RUF002",        # ambiguous unicode in docstrings (× is intentional)
  "RUF003",        # ambiguous unicode in comments
  "RUF012",        # mutable class attributes — Config-class pattern is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "F841", "RUF059"]
"task_prioritizer/main.py" = ["E402", "F841", "RUF059", "SIM103"]  # cleaned up in Phase 4.3 refactor

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: tests that hit real external services (clockify, ollama)",
  "slow: tests slower than 1s",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["task_prioritizer"]
omit = ["task_prioritizer/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
